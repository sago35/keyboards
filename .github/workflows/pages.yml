name: Pages

on:
  push:
    branches:
      - main
    paths:
      - panel25/firmware-ble/webble/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}panel25/firmware-ble/webble/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir -p _site/panel25/firmware-ble/webble
          cp panel25/firmware-ble/webble/index.html _site/panel25/firmware-ble/webble/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
